spring.application.name=sistema-control-asistencia-nomina

# Azure SQL / SQL Server. Configurar estas variables en el entorno de ejecución.
spring.datasource.url=jdbc:sqlserver://${DB_SERVIDOR}
spring.datasource.username=${DB_USUARIO}
spring.datasource.password=${DB_CLAVE}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# Cifrado de conexión habilitado. Configurar correctamente la confianza del certificado.
spring.datasource.hikari.data-source-properties.encrypt=true
spring.datasource.hikari.data-source-properties.trustServerCertificate=false

# El esquema se administra mediante el script DDL; Hibernate solo valida el mapeo.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
