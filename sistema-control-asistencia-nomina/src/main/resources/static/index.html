<!doctype html>
<html lang="es">
  <head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema Control de Asistencia y Nómina</title>

    <style>
      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f4;
        text-align: center;
        margin: 0;
        padding-top: 80px;
      }

      .contenedor {
        background: white;
        width: 700px;
        max-width: 90%;
        margin: auto;
        padding: 30px;
        border-radius: 10px;

      }

      h1 {
        color: #0078d4;
      }

      p {
        color: #444;
      }

      a {
        display: inline-block;

        padding: 10px 15px;
        background-color: #0078d4;

      }

  <body>
    <div class="contenedor">
      <h1>Sistema de Control de Asistencia y Nómina</h1>
